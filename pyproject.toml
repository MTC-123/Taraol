[project]
name = "taraol"
version = "0.1.0"
description = "Drop-in OpenTelemetry instrumentation for multi-agent systems: gen_ai spans, cross-process traceparent, cost rollup, loop/injection/breaker/provenance analysis — in ~3 lines."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
keywords = ["opentelemetry", "otel", "observability", "ai-agents", "gen_ai", "signoz"]
dependencies = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.28.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
http = ["opentelemetry-exporter-otlp-proto-http>=1.28.0"]
# JSON-RPC agent-to-agent transport (integrations/a2a).
a2a = ["fastapi>=0.115.0", "uvicorn>=0.32.0", "httpx>=0.28.0"]
# Loop/budget/injection/breaker watcher + controller (detection/).
detection = ["httpx>=0.28.0", "fastapi>=0.115.0", "uvicorn>=0.32.0"]
# Grounded incident explanation over the official SigNoz MCP server (mcp/).
mcp = ["mcp>=1.28.1"]
# Real web search tool (tools/search.py); the fake provider needs no extra.
search = ["httpx>=0.28.0"]
# Real LLM providers (gemini/openai-compatible) via the kit's llm module.
llm = ["httpx>=0.28.0"]
all = ["taraol[http,a2a,detection,mcp,search,llm]"]

[project.scripts]
taraol = "taraol.cli:main"

[dependency-groups]
# Everything the test suite + tooling needs (the extras' runtime deps included).
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    # scripts/make_gifs.py renders the animated figures in docs/.
    "pillow>=11.0.0",
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "mcp>=1.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taraol"]
# Data files (pricing.yaml, dashboards/*.json) live inside the package and are
# included automatically; artifacts ensures they ship even if git-ignored.
artifacts = ["src/taraol/data/**"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Ruff >=0.16 formats Python code blocks embedded in Markdown. Docs here hand-align their
# samples for readability, so keep the formatter scoped to Python and leave prose alone.
extend-exclude = ["*.md"]

# Pin the lint rule set (Ruff's classic default: pyflakes + import/statement/syntax errors).
# Keeps CI deterministic across Ruff releases, whose default select has widened to include
# style opinions the project hasn't adopted.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
